{% extends 'frame/base.html' %}


{% block container %}
  <div>
    <ul class="list-group list-group-flush">
      <li class="list-group-item">
        <div class="mt-3">
          <a class="icon-link link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover"
             href="{{ url_for('testing.create') }}"
          >
            <img src="{{ url_for('static', filename='add.svg') }}" alt="add testing">
            新建测试
          </a>
        </div>
      </li>
        {% for testing in testing_list %}
          <li class="list-group-item">
            <div class="text-break" style="font-size: 16px; font-weight: 700;">
              <a href="{{ url_for('testing.detail', id=testing.id) }}" style="color: #555; text-decoration: none;">
                【{{ testing.display_type_zh }}】
              </a>
            </div>
            <div class="text-break" style="font-size: 14px;">
              <span class="ms-2">{{ testing.display_state_emoji }} {{ testing.vps_name }}</span>
            </div>
          </li>
        {% endfor %}
    </ul>
  </div>
{% endblock %}


{% block scripts %}
  {{ super() }}
{% endblock %}
